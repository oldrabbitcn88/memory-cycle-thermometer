name: Probe memory-price fetcher
on:
  push:
    branches: [diagnose-source-20261015]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Run the repository fetcher without writes
        run: python scripts/fetcher.py

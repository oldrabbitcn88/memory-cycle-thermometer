name: 每周更新存储周期温度计

on:
  schedule:
    - cron: "30 0 * * 1"      # UTC 周一 00:30 = 北京 08:30
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: 安装依赖
        run: pip install requests tencentcloud-sdk-python cos-python-sdk-v5 anthropic

      # 计算与上传拆成两步，且提交先于上传：
      # 上传原本是 main() 的最后一步，一旦对象存储不可用（停服/欠费/回收），
      # 整个 job 失败，后面的 git commit 根本不会执行，当周读数就此蒸发。
      # 2026-08-19 环境停服时，下一个周一恰好会踩中这条路径。
      - name: 抓取 → 机械映射 → 落盘
        id: compute
        env:
          # 以下均为可选：仅用于生成一句话点评，缺失或失败都不影响出分
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        run: python scripts/update.py --no-upload

      - name: 回归自检（确保打分口径未漂移）
        id: selfcheck
        run: python backtest/probe.py | tail -8

      - name: 提交历史回仓库
        run: |
          git config user.name "thermometer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history_v3.json data/data.json
          if git diff --cached --quiet; then
            echo "本期读数与仓库一致，无需提交"
          else
            git commit -m "读数更新 $(date -u +%F)"
            # 远端可能已被人工提交推进；若本次是对旧 run 的 re-run，checkout 还会停在
            # 旧 commit 上，直接 push 必被拒。先 rebase 到远端最新再推。
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # 上传后端二选一，由 Variables 决定，无需改代码：
      #   设了 COS_BUCKET  → 直传普通 COS 桶（与云开发计费解耦，推荐）
      #   没设 COS_BUCKET  → 回落到云开发 Storage，用 TCB_ENV 反查桶名
      # 只要读数算出来了且自检通过，就必须传——提交失败（推送被拒、远端跑在前面）
      # 不该连带让数据到不了用户手里。反过来，提交在上传之前，上传挂了也不丢读数。
      # 两个方向都堵上，这两步才真正互不阻塞。
      - name: 上传到对象存储
        if: always() && steps.compute.outcome == 'success' && steps.selfcheck.outcome == 'success'
        env:
          TCB_SECRET_ID:  ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV:        ${{ secrets.TCB_ENV }}
          COS_BUCKET:     ${{ vars.COS_BUCKET }}
          COS_REGION:     ${{ vars.COS_REGION }}
        run: python scripts/update.py --upload-only

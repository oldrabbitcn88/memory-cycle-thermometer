name: 每周更新存储周期温度计

on:
  schedule:
    # UTC 周一 00:30 = 北京时间 周一 08:30
    - cron: "30 0 * * 1"
  workflow_dispatch: {}   # 支持手动触发（首次部署时用）

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install requests

      - name: 打分并上传云开发存储
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_SECRET: ${{ secrets.WX_SECRET }}
          TCB_ENV: ${{ secrets.TCB_ENV }}
        run: python scripts/update.py

      - name: 提交历史数据回仓库（真实累积，git 即审计记录）
        run: |
          git config user.name "thermometer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json data/data.json
          git diff --cached --quiet || git commit -m "读数更新 $(date -u +%F)"
          git push
